spring.application.name=just-in-transit
server.port=${PORT:8081}
# This first release is a private, single-user app on your computer.
server.address=127.0.0.1
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:h2:file:./data/commutes;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
via.schedule-url=https://www.viainfo.net/BusService/google_transit.zip
via.realtime-url=http://gtfs.viainfo.net/tripupdate/tripupdates.pb
via.cache-dir=./data
via.enabled=true
via.vehicles-url=${VIA_VEHICLES_URL:http://gtfs.viainfo.net/vehicle/vehiclepositions.pb}

# Explicit, cached lookups for this private prototype; configurable for self-hosted services.
via.alerts-url=${VIA_ALERTS_URL:http://gtfs.viainfo.net/alert/alerts.pb}
maps.enabled=${JIT_MAPS_ENABLED:true}
# Numbered addresses use Census ranges; place names and fallback use Photon.
maps.address-enabled=${JIT_ADDRESS_GEOCODER_ENABLED:true}
maps.address-url=${JIT_ADDRESS_GEOCODER_URL:https://geocoding.geo.census.gov/geocoder/locations/onelineaddress}
maps.search-url=${JIT_GEOCODER_URL:https://photon.komoot.io/api/}
maps.walk-url=${JIT_WALKING_URL:https://valhalla1.openstreetmap.de/route}
maps.client-id=${JIT_MAP_CLIENT_ID:just-in-transit-local}
maps.tile-url=${JIT_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
maps.tile-credit=${JIT_MAP_TILE_CREDIT:}

# Active session plus an expiring DB checkpoint support screen locks and explicit same-browser resume.
server.servlet.session.timeout=18h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
