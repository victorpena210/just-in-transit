# One owner account; requires HTTPS (direct TLS or a trusted local reverse proxy).
jit.access.enabled=true
jit.access.username=${JIT_USERNAME:victor}
jit.access.password=${JIT_PASSWORD:}
# Default stays behind a same-machine proxy. Set an explicit LAN bind only with direct TLS.
server.address=${JIT_BIND_ADDRESS:127.0.0.1}
server.servlet.session.cookie.secure=true
# Keep forwarding disabled unless your trusted proxy is the only path to this server.
server.forward-headers-strategy=${JIT_FORWARD_HEADERS:none}
