# Explicit no-login mode. Settings and reports are isolated by browser credential.
# Use public,mysql behind HTTPS on Railway; set JIT_FORWARD_HEADERS=framework.
jit.access.enabled=false
jit.access.allow-public=true
server.address=${JIT_BIND_ADDRESS:0.0.0.0}
server.servlet.session.cookie.secure=true
# On Railway set JIT_FORWARD_HEADERS=framework; do not expose a direct TCP proxy.
server.forward-headers-strategy=${JIT_FORWARD_HEADERS:none}
spring.thymeleaf.cache=true
