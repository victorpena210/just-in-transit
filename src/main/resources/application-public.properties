# Explicitly public, shared app: no website username or password is required.
# Anyone who reaches the app can view/change saved commutes and trip history.
# Use public,mysql on Railway. Do not use this mode for private location data.
jit.access.enabled=false
jit.access.allow-public=true
server.address=${JIT_BIND_ADDRESS:0.0.0.0}
server.servlet.session.cookie.secure=true
# On Railway set JIT_FORWARD_HEADERS=framework; do not expose a direct TCP proxy.
server.forward-headers-strategy=${JIT_FORWARD_HEADERS:none}
spring.thymeleaf.cache=true
